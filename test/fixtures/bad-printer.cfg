# fixture: a printer.cfg with config problems
# made by scripts/make-fixtures.mjs. Not a real user's printer.cfg.
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_ABC123-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 235

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 235

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC2
position_endstop: 0.5
position_max: 250

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_kp: 26.213
pid_ki: 1.304
pid_kd: 131.721
pid_integral_max: 0.2
min_temp: 0
max_temp: 270

[heater_bed]
heater_pin: PC9
sensor_pin: PC4
control: watermark
min_temp: 0
max_temp: 130

[safe_z_home]
home_xy_position: 117, 117

[homing_override]
gcode:
  G28 X Y

[gcode_macro START_PRINT]
gcode:
  G28
G1 Z10 F600
