# Publishes to npm and cuts the GitHub Release when a merge to main raises the version in package.json.
#
# To release: add a "## [x.y.z]" section to CHANGELOG.md, run `npm version <patch|minor|major> --no-git-tag-version`,
# change the two version fields in server.json, and merge. Re-running a failed run finishes whatever is left, so a
# failed release step does not need a new version.
#
# Only an NPM_TOKEN secret can do the first publish. With no token the plan step leaves a notice and the run ends
# green with nothing published. Add the secret, then run this workflow by hand (Actions > publish > Run workflow).
#
# Once the package exists, auth is whichever of these is available, in this order:
#   1. The NPM_TOKEN secret: a granular token with publish rights on klipper-doctor-mcp and bypass 2FA on.
#   2. npm trusted publishing over OIDC. Set it up once on npmjs.com under the package's Settings > Trusted publisher
#      > GitHub Actions, repository kd-011/klipper-doctor-mcp, workflow filename publish.yml. Needs npm 11.5.1 or
#      later (installed below) and `id-token: write`.
# Provenance needs the repository to stay public.
#
# Tags and releases made with GITHUB_TOKEN start no other runs and there is no tag trigger, so nothing publishes twice.
name: publish

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-node is not given a registry: it would write a placeholder token, which would stop OIDC from being used.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: What is left to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release.mjs plan
      - name: Nothing to publish yet
        if: steps.plan.outputs.skip == 'true'
        run: echo "::notice::publish skipped. No NPM_TOKEN secret and the package is not on npm yet. Add the secret, then run this workflow by hand."
      - name: Install npm 11 for trusted publishing
        if: steps.plan.outputs.publish == 'true'
        run: npm install -g npm@^11.5.1
      - if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - if: steps.plan.outputs.publish == 'true'
        run: npm run check
      - if: steps.plan.outputs.publish == 'true'
        run: npm test
      # Before publishing, so a missing changelog section cannot leave a version on npm with no release.
      - name: Release notes from CHANGELOG.md
        if: steps.plan.outputs.publish == 'true' || steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Publish to npm
        if: steps.plan.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with the NPM_TOKEN secret"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          else
            echo "NPM_TOKEN is not set: publishing with trusted publishing (OIDC)"
          fi
          npm publish --provenance --access public --ignore-scripts
      - name: Tag and GitHub Release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --target "${GITHUB_SHA}"
